# Autonomía de producto de los agentes (decisión del fundador, 2026-10-28).
# Ramas claude/auto-*: compila, prueba, deja etiqueta de vuelta atrás, fusiona en main, despliega,
# comprueba la web en vivo y, si falla, revierte sola y vuelve a desplegar.
# Excluido (necesita OK del fundador): precios, condiciones, privacidad, pagos/API, configuración, integraciones y .github.
name: Auto-publicación de agentes
on:
  push:
    branches: ['claude/auto-**']
permissions:
  contents: write
  actions: write
# Grupo propio: si compartiera «deploy» con deploy.yml, cada uno esperaría al otro.
concurrency:
  group: auto-claude
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archivos protegidos
        id: protegidos
        run: |
          git fetch -q origin main
          CAMBIOS=$(git diff --name-only origin/main...HEAD)
          echo "$CAMBIOS"
          PROT=$(echo "$CAMBIOS" | grep -E '^(src/data/(site|contrata|contrata-logica|faq|schema)\.|src/pages/(condiciones|privacidad|contratar)|public/(api|lib)/|public/contact\.php|public/\.htaccess|api/|config/|integraciones/|\.github/|package(-lock)?\.json)' || true)
          if [ -n "$PROT" ]; then echo "bloqueado=1" >> "$GITHUB_OUTPUT"; echo "motivo=archivos que requieren OK del fundador: $(echo $PROT)" >> "$GITHUB_OUTPUT"; else echo "bloqueado=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.protegidos.outputs.bloqueado == '0'
        with:
          node-version: 22
          cache: npm
      - name: Compilar y probar
        id: pruebas
        if: steps.protegidos.outputs.bloqueado == '0'
        run: |
          npm ci
          npm run build
          npm run test:leads-hoja
          node tests/calculadora.mjs
      - name: Fusionar, desplegar, comprobar y revertir si falla
        id: publicar
        if: steps.protegidos.outputs.bloqueado == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RAMA: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ANTES=$(git rev-parse origin/main)
          ETIQUETA="vuelta-atras-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$ETIQUETA" "$ANTES" && git push -q origin "$ETIQUETA"
          git checkout -q -B main origin/main
          git merge --no-ff -q -m "Auto-publicación de $RAMA" "$GITHUB_SHA"
          git push -q origin main
          desplegar() {
            gh workflow run deploy.yml -R "$REPO" --ref main
            sleep 15
            ID=$(gh run list -R "$REPO" --workflow deploy.yml --limit 1 --json databaseId -q '.[0].databaseId')
            gh run watch "$ID" -R "$REPO" --exit-status
            sleep 150   # Hostinger publica la rama hostinger
          }
          # El antibots de Hostinger devuelve 403 al User-Agent por defecto de curl desde IP de centros de
          # datos: se pide como un navegador normal, con identificador propio, y se reintenta.
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 SobtreeDeployCheck/1.0'
          CHK=$(mktemp -d)
          # pedir URL → deja el cuerpo en $CHK/cuerpo y las cabeceras en $CHK/cab; imprime el código HTTP.
          # Hasta 3 intentos con 20 s de espera mientras no sea 200; si acaba en 403, vuelca el diagnóstico.
          pedir() {
            local u="$1" c=000 i
            for i in 1 2 3; do
              rm -f "$CHK/cab" "$CHK/cuerpo"   # nunca validar el cuerpo de una petición anterior
              c=$(curl -s --max-time 20 -A "$UA" \
                    -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,application/json;q=0.8,*/*;q=0.7' \
                    -H 'Accept-Language: es-ES,es;q=0.9,en;q=0.8' \
                    -D "$CHK/cab" -o "$CHK/cuerpo" -w '%{http_code}' "$u" || true)
              [ "$c" = "200" ] && break
              echo "$u → $c (intento $i/3)" >&2
              if [ "$i" -lt 3 ]; then sleep 20; fi
            done
            if [ "$c" = "403" ]; then
              { echo "--- cabeceras de respuesta de $u (Set-Cookie ocultas) ---"
                sed -E 's/^(set-cookie:).*/\1 [oculto]/I' "$CHK/cab" 2>/dev/null || true
                echo "--- primeros 300 bytes del cuerpo ---"
                head -c 300 "$CHK/cuerpo" 2>/dev/null || true
                echo; echo "---"; } >&2
            fi
            echo "$c"
          }
          comprobar() {
            ok=1
            for u in https://sobtree.com/ https://sobtree.com/contratar/ https://sobtree.com/condiciones/; do
              c=$(pedir "$u"); echo "$u → $c"; [ "$c" = "200" ] || ok=0
            done
            # El cuerpo se lee de archivo: con pipefail, «curl | grep -q» da falso fallo (curl recibe SIGPIPE).
            pedir https://sobtree.com/ >/dev/null
            grep -qi 'sobtree' "$CHK/cuerpo" 2>/dev/null || { echo "portada sin 'sobtree'"; ok=0; }
            pedir https://sobtree.com/api/contrata/disponibilidad.php >/dev/null
            grep -q '"ok":true' "$CHK/cuerpo" 2>/dev/null || { echo "disponibilidad sin ok:true"; ok=0; }
            [ $ok = 1 ]
          }
          desplegar
          if comprobar; then
            echo "estado=publicado" >> "$GITHUB_OUTPUT"
          else
            echo "Fallo tras desplegar: revierto a $ETIQUETA"
            git push -q -f origin "$ANTES:main"
            desplegar
            comprobar && echo "estado=revertido" >> "$GITHUB_OUTPUT" || echo "estado=revertido_con_fallo" >> "$GITHUB_OUTPUT"
          fi
      - name: Registrar resultado
        if: always()
        env:
          RAMA: ${{ github.ref_name }}
          BLOQ: ${{ steps.protegidos.outputs.bloqueado }}
          MOTIVO: ${{ steps.protegidos.outputs.motivo }}
          PRUEBAS: ${{ steps.pruebas.outcome }}
          ESTADO: ${{ steps.publicar.outputs.estado }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BLOQ" = "1" ]; then E="pendiente_ok_fundador"; M="$MOTIVO"; elif [ "$PRUEBAS" != "success" ]; then E="pruebas_fallidas"; M="compilación o pruebas en rojo"; else E="${ESTADO:-error}"; M="ver ejecución $GITHUB_RUN_ID"; fi
          git fetch -q origin claude/auto-resultados && git worktree add -q /tmp/res origin/claude/auto-resultados || git worktree add -q --orphan -b tmp-res /tmp/res
          mkdir -p /tmp/res/web
          printf '{"fecha":"%s","rama":"%s","commit":"%s","estado":"%s","motivo":"%s"}\n' "$(date -u +%FT%TZ)" "$RAMA" "$GITHUB_SHA" "$E" "$M" >> /tmp/res/web/registro.jsonl
          cd /tmp/res && git add -A && git commit -qm "auto-publicación: $RAMA $E" && git push -q origin HEAD:claude/auto-resultados
