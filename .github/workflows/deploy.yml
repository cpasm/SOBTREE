# Compila la web con Astro y la sube a Hostinger por FTP en cada push a main.
# Desactivado hasta que configures en GitHub (Settings → Secrets and variables → Actions):
#   Secretos:  FTP_SERVER (p. ej. ftp.sobtree.com, en hPanel → Archivos → Cuentas FTP), FTP_USERNAME, FTP_PASSWORD
#   Variable:  DEPLOY_ENABLED = true
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir por FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow true; set ssl:verify-certificate no;
            set ftp:passive-mode true; set net:max-retries 3; set net:timeout 30;
            echo 'Carpetas en la raiz FTP:'; cls -1;
            mirror --reverse --verbose --parallel=2 dist/ public_html/;
            bye"
