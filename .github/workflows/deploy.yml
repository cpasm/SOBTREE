# Compila la web con Astro y la sube a Hostinger por FTP en cada push a main.
# Desactivado hasta que configures en GitHub (Settings → Secrets and variables → Actions):
#   Secretos:  FTP_SERVER (p. ej. ftp.sobtree.com, en hPanel → Archivos → Cuentas FTP), FTP_USERNAME, FTP_PASSWORD
#   Variable:  DEPLOY_ENABLED = true
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./public_html/
